- name: Full patching (no reboot)
  hosts: all_servers
  become: yes

  vars:
    ansible_python_interpreter: /usr/bin/python3

  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:

    - name: Show start message
      debug:
        msg: "Server: {{ inventory_hostname }} | Starting patching"

    # 0️⃣ Wait for any existing apt/dpkg lock to clear
    - name: Wait for apt lock to be released
      shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 2
        done
      changed_when: false

    # 1️⃣ Update package list
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # 2️⃣ Install unattended-upgrades (for security patches)
    - name: Install unattended-upgrades
      apt:
        name: unattended-upgrades
        state: present

    # 2️⃣.5 Prevent needrestart interactive prompt (Ubuntu 20.04+)
    - name: Set needrestart to auto-restart mode (non-interactive)
      lineinfile:
        path: /etc/needrestart/needrestart.conf
        regexp: "^#?\\$nrconf\\{restart\\}"
        line: "$nrconf{restart} = 'a';"
        create: yes
      ignore_errors: yes

    # 3️⃣ Upgrade all packages (includes security updates)
    - name: Upgrade all packages
      apt:
        upgrade: dist
        force_apt_get: yes
      register: upgrade_result

    # 4️⃣ Run security updates explicitly
    - name: Run security updates
      command: unattended-upgrade -d
      register: security_result
      changed_when: "'Packages that will be upgraded' in security_result.stdout"

    # 5️⃣ Final status
    - name: Show final status
      debug:
        msg: |
          Server: {{ inventory_hostname }}
          Upgrade changed: {{ upgrade_result.changed }}
          Security output: {{ security_result.stdout | default('No output') }}
